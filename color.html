<!DOCTYPE html>
<html>

		}

		}

		#next{

		}

		#next:hover {
			scale:1.1;
		}


		#goal {
			width:500px;
			height:500px;
			background-color:white;

	</style>
</head>

	<input type="color"  value="#000000" id = "picker">
	<div id="check">check</div>
	<div id="next">start</div>
	<div id="score"></div>

	<div id="goal"></div>
	<script>

			// console.log(picker.value)
			// red

			const redHex = picker.value.substring(1, 3); 
			// Convert from hex string to decimal integer
			const redValue = parseInt(redHex, 16); 
			// console.log(goalRedValue)


			
			const match1 = random_rgb.match(/\d+/g); 
			const goalRedValue = match1 ? parseInt(match1[0]) : null;



			// green

			const greenHex = picker.value.substring(3, 5); 
			// Convert from hex string to decimal integer
			const greenValue = parseInt(greenHex, 16); 
			// console.log(goalGreenValue)

		document.getElementById("next").addEventListener("click", function() {

			random_hex = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0')
			document.getElementById("goal").style.backgroundColor = random_hex
