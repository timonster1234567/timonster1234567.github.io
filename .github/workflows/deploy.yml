name: Deploy Static Content

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: workflows/pages-templates/actions/deploy-pages@v1
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This specifies exactly what to upload. 
          # We tell it to exclude the entire Trading folder from the website build.
          path: '.'
          exclude: |
            Trading/**

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
