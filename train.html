<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>train</title>

	<style>
		#train {
			display:flex;
			gap:12px;
		}

		.cart {
			border: 1px solid black;
			min-width: 100px;
			height:80px;
			text-align:center;
			position:relative;
		}

		.cart:before {
			content:"";
			width:30px;
			height:30px;
			display:block;
			border-radius:50%;
			border:1px solid black;
			position:absolute;
			bottom:-15px;
			background-color:white;
		}

		.cart:after {
			content:"";
			width:30px;
			height:30px;
			/*display:block;*/
			border-radius:50%;
			border:1px solid black;
			position:absolute;
			bottom:0;
			bottom:-15px;
			background-color:white;
		}
	</style>
</head>
<body>

	<input type="text" id = "person">
	<button id = "add-person">add person</button>
	<button id = "remove-person">remove person</button>

	<div id="train">

		<div class="cart">gia</div>
		<div class="cart">theo</div>
	</div>

</body>
</html>
