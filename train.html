		:root {
  			--distance-left: 0px;
  			--distance-left-end: 114px;
		}

		@keyframes train_move {
			from { 
				transform: translateY(0px) scaleX(1) scaleY(1); 
				/*transform: scaleX(1);
				transform: scaleY(1);*/
			}
			to {
				transform: translateY(200px) scaleX(0) scaleY(0); 
				/*transform: scaleX(0);
				transform: scaleY(0);*/
			}
		}

		.make_train_move {
		  animation-name: train_move;
		  animation-duration: 2s;
		  animation-iteration-count: 1;
		  animation-fill-mode: forwards; 
		}

		@keyframes front_move {
			from { 
				transform: translateX(var(--distance-left)); 
			}
			to {
				transform: translateX(var(--distance-left-end)); 
			}
		}

		.make_front_move {
		  animation-name: front_move;
		  animation-duration: 2s;
		  animation-iteration-count: var(--num-iterations);
		  animation-fill-mode: forwards; 
		}
