<!DOCTYPE html>

<head>
	<style>
		.confetti {
			width: 30px;
			height:10px;
			background-color:blue;
			position: absolute;

			animation-name: fall;
			animation-duration: 1.5s;
			animation-iteration-count: infinite;

			/*animation-name: rotation;
			animation-duration: 1s;
			animation-iteration-count: infinite;*/
		}

		@keyframes fall {
			0% {
					transform: rotate(-25deg) translateX(20px) rotateX(-85deg) rotateY(0deg);
			}

			25% {
				transform: rotateY(-85deg);
			}

			50% {
					transform: rotate(25deg) translateX(-20px) rotateX(85deg) ;
			}

			25% {
				transform: rotateY(85deg);
			}

			100% {
					transform: rotate(-25deg) translateX(20px) rotateX(-85deg) rotateY(0deg);
		}
	}
