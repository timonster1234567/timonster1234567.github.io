<!DOCTYPE html>
<html>
<head>
	<style>
		.container {
			display: grid;
			grid-template-columns:repeat(4, 1fr);
		}
		.item {
			border: 1px solid black;
			
			/*width: 100px;
			height: 100px;*/
		}

		.item img {
			width:99%;
			height:99%;
			object-fit: cover;
		}

		/*#favorite {
			grid-column:7/12;
			grid-row:7/12;
		}*/

		@media (max-width: 800px) {
			body {
				background-color: yellow;
			}
			.container {
				grid-template-columns:repeat(1, 1fr);
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class = "item" id = "favorite">
			<img src="cool_image.jpeg" alt="cool_image"></img>
		</div>
		<div class = "item">
			<img src="cool_image2.jpeg" alt="cool_image2"></img>
		</div>
		<div class = "item">
			<img src="cool_image3.jpeg" alt="cool_image3"></img>
		</div>
		<div class = "item">
			<img src="cool_image4.jpeg" alt="cool_image4"></img>
		</div>
		<div class = "item">
			<img src="cool_image5.jpeg" alt="cool_image5"></img>
		</div>
	</div>
</body>
</html>
